<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 70" width="330" height="70" role="img" aria-label="Solution Hub">
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Icon mark: hub node -->
  <rect x="4" y="7" width="56" height="56" rx="16" fill="url(#hb)"/>
  <g fill="#ffffff">
    <circle cx="32" cy="35" r="6.5"/>
    <circle cx="32" cy="17.5" r="4.4"/>
    <circle cx="32" cy="52.5" r="4.4"/>
    <circle cx="17" cy="26" r="4.4"/>
    <circle cx="47" cy="26" r="4.4"/>
    <circle cx="17" cy="44" r="4.4"/>
    <circle cx="47" cy="44" r="4.4"/>
    <g stroke="#ffffff" stroke-width="2.4" opacity="0.85">
      <line x1="32" y1="35" x2="32" y2="17.5"/>
      <line x1="32" y1="35" x2="32" y2="52.5"/>
      <line x1="32" y1="35" x2="17" y2="26"/>
      <line x1="32" y1="35" x2="47" y2="26"/>
      <line x1="32" y1="35" x2="17" y2="44"/>
      <line x1="32" y1="35" x2="47" y2="44"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="74" y="34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#172033" letter-spacing="-0.3">Solution</text>
  <text x="74" y="56" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#a78bfa" letter-spacing="7">HUB</text>
